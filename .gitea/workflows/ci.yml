name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run test:bridge
      - run: python -m pip install -r apps/webos/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:webos

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: apps/android-tv
