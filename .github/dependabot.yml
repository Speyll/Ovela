version: 2
updates:
  - package-ecosystem: npm
    directory: /
    groups:
      npm-dependencies:
        patterns: ['*']
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /apps/android-tv
    open-pull-requests-limit: 3
    groups:
      android-dependencies:
        patterns: ['*']
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns: ['*']
    schedule:
      interval: monthly
