name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - uses: android-actions/setup-android@v4
      - name: Install tools
        run: |
          npm install -g @webos-tools/cli
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Prepare and test shared/webOS code
        run: |
          npm run prepare:apps
          npm run check:versions
          npm run check:android-toolchain
          npm run check:webos
          npm run check:bridge
          npm run test:bridge
          npm run test:core
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run production webOS browser tests
        run: |
          python -m pip install -r apps/webos/tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm run test:webos
      - name: Build webOS
        run: npm run build:webos
      - name: Configure Android release signing
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ovela-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/android-tv/keystore.properties
      - name: Build signed Android TV release
        if: env.HAS_ANDROID_SIGNING == 'true'
        working-directory: apps/android-tv
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../dist/ci
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee ../../dist/ci/android-release-build.log
      - name: Build Android TV debug fallback
        if: env.HAS_ANDROID_SIGNING != 'true'
        working-directory: apps/android-tv
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../dist/ci
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee ../../dist/ci/android-release-build.log
      - name: Checksums
        run: |
          mkdir -p dist/release
          cp dist/webos/*.ipk dist/release/
          if [ -f apps/android-tv/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/android-tv/app/build/outputs/apk/release/app-release.apk dist/release/Ovela-AndroidTV.apk
          else
            cp apps/android-tv/app/build/outputs/apk/debug/app-debug.apk dist/release/Ovela-AndroidTV-debug.apk
          fi
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ovela-release-build-log
          path: dist/ci/android-release-build.log
          if-no-files-found: ignore
      - name: Select versioned release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/${version}.md"
          if [ -f "$notes" ]; then
            echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          else
            mkdir -p dist/ci
            node scripts/release-notes.mjs > dist/ci/release-notes.md
            echo "RELEASE_NOTES=dist/ci/release-notes.md" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/release/*
