# Manual-only release build. It is never triggered by a tag push, so the
# established local release process cannot be disturbed by pushing a tag.
# It still requires the four Android signing secrets and fails before building
# if any is missing.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Configure the Android signing secrets or build the release locally."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version. Bump the version before releasing."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - uses: android-actions/setup-android@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          set -euo pipefail
          npm install -g @webos-tools/cli
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Android unit tests
        working-directory: apps/android-tv
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: webOS browser tests
        run: |
          set -euo pipefail
          python -m pip install -r apps/webos/tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm run test:webos

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ovela-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/android-tv/keystore.properties

      - name: Build webOS IPK
        run: npm run build:webos

      - name: Build Android APK
        run: npm run build:android

      - name: Verify packaged artifacts
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          apk="dist/release/Ovela-AndroidTV-${version}.apk"
          ipk="dist/webos/io.github.speyll.ovela_${version}_all.ipk"
          test -f "$apk"
          test -f "$ipk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -q '^assets/licenses/Apache-2.0.txt$' "$RUNNER_TEMP/apk-files.txt"
          grep -q '^assets/licenses/XtreamlyTV-MIT.txt$' "$RUNNER_TEMP/apk-files.txt"
          ar p "$ipk" data.tar.gz > "$RUNNER_TEMP/ipk-data.tar.gz"
          tar -tzf "$RUNNER_TEMP/ipk-data.tar.gz" > "$RUNNER_TEMP/ipk-files.txt"
          grep -q 'assets/licenses/Apache-2.0.txt$' "$RUNNER_TEMP/ipk-files.txt"
          grep -q 'assets/licenses/XtreamlyTV-MIT.txt$' "$RUNNER_TEMP/ipk-files.txt"

      - name: Checksums
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          ipk="io.github.speyll.ovela_${version}_all.ipk"
          apk="Ovela-AndroidTV-${version}.apk"
          cp "dist/webos/$ipk" dist/release/
          cd dist/release
          sha256sum "$ipk" "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "Ovela ${RELEASE_TAG#v}" \
            --generate-notes \
            dist/release/*.ipk dist/release/*.apk dist/release/SHA256SUMS.txt
