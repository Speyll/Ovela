services:
  ovela-api-bridge:
    build: .
    container_name: ovela-api-bridge
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      BRIDGE_TOKEN: "replace-with-a-long-random-token"
      ALLOWED_SERVERS: "https://your-provider.example"
      ALLOWED_PLAYLISTS: "https://your-provider.example/playlist.m3u"
      ALLOWED_ORIGINS: "null,http://localhost"
